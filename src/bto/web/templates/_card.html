<a class="job-card" href="{{ url_for('review.review',id=job.id) }}">
<span class="eyebrow">{{ job.advertiser_name or 'Advertiser not supplied' }} · {{ job.market|upper }}</span>
<strong>{{ job.title or 'Title not supplied' }}</strong>
<span class="bucket {{ job.bucket or 'not_sorted' }}">{{ bucket_labels.get(job.bucket,'Awaiting assessment') }}</span>
</a>
