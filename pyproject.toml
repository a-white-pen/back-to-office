[project]
name = "bto"
version = "0.2.13"
description = "Back to Office — a personal job-search system"
requires-python = ">=3.12"
license = { file = "LICENSE" }

dependencies = [
  "psycopg[binary]>=3.2",
  "numpy>=2.0",
  # Deterministic MinHash output is part of the matching contract.
  "datasketch==2.0.0",
  # Country reference data must not drift under rebuilds.
  "pycountry==26.2.16",
]

[project.optional-dependencies]
# Web runtime is installed separately from the nightly collection.
web = ["Flask>=3.1"]

# Databricks provides PySpark; install it locally for parity tests.
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "pyspark>=3.5",
]

[project.scripts]
bto-canonicalize = "bto.clean_job_listings.canonicalize_on_databricks:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
ignore = [
  "BLE001",  # provider and workflow failure boundaries
  "ISC004",  # adjacent SQL string literals
  "TRY004",  # provider response validation uses ValueError
  "UP031",   # GraphQL zone substitution
  "UP017",   # keep timezone.utc consistent
  "FURB162", # normalize provider timestamps before parsing
]

[tool.ruff.lint.per-file-ignores]
# Dotted example filenames are templates, never imported as modules.
"**/*.example.py" = ["N999"]

[tool.setuptools.package-data]
"bto.web" = ["templates/*.html", "static/*.css", "static/*.js"]
"bto.send_notifications" = ["*.html"]
